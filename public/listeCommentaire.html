<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Liste des commentaires</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="nav-bar">
        <a class="accueil-btn" href="/accueil.html">Accueil</a>
        <button class="secondary" onclick="logout()">Déconnexion</button>
    </div>

    <div class="container">
        <div class="topbar">
            <div>
                <h1>Liste des commentaires</h1>
                <p class="small">Modifier et supprimer des commentaires existants</p>
            </div>
            <div class="actions">
                <a class="btn-link" href="/indexCommentaire.html">Retour à l'ajout</a>
            </div>
        </div>

        <div id="message"></div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>ID du joueur</th>
                    <th>Console</th>
                    <th>Plateforme</th>
                    <th>Commentaire</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tbodyListe"></tbody>
        </table>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/listeCommentaire.js"></script>
</body>
</html>
