<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des jeux</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="topbar">
            <div>
                <h1>Gestion des jeux</h1>
                <p class="small">Ajout et affichage dans un tableau</p>
            </div>
            <div class="actions">
                <a class="btn-link" href="/liste.html">Voir la liste complète</a>
                <button class="secondary" onclick="logout()">Déconnexion</button>
            </div>
        </div>

        <div id="message"></div>

        <h2>Ajouter un jeu</h2>
        <form id="formAjout">
            <input type="text" id="nom" placeholder="Nom" required>
            <input type="text" id="note" placeholder="Note" required>
            <button type="submit">Ajouter</button>
        </form>

        <h2>Ensemble des jeux</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Note</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tbodyJeux"></tbody>
        </table>
    </div>

    <script src="js/authJeux.js"></script>
    <script src="js/indexJeux.js"></script>
</body>
</html>
